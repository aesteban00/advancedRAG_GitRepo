# Configuracion del proyecto de memoria (Agent Engine Memory): modelo de embeddings y LLM de extraccion.
memory_only: true

memory:
  log_level: info

  # Voyage AI embeddings.
  voyage:
    model: "voyage-4-large"
    dimension: 1024

  # LLM used for background extraction via the Grove gateway (DeepSeek).
  extraction_llm:
    provider: openai
    model: deepseek-v4-flash-0731
    base_url: https://grove-gateway-prod.azure-api.net/grove-foundry-prod/openai/v1
    api_key_secret: LLM_API_KEY
    auth_header: api-key

  background_extraction:
    snapshot:
      max_messages: 20
      stale_minutes: 1

  extraction:
    enabled:
      - semantic
      - episodic
      - taxonomic
      - procedural